<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Social Signals — sentiment/emotion in political posts: speech bubbles + sentiment bars -->
  <!-- construction guide -->
  <circle cx="200" cy="190" r="140" stroke="#3a5a4e" stroke-width="1" opacity="0.2"/>

  <!-- speech bubble 1 (oxblood) with a hashtag -->
  <path d="M 108 96 h 104 a 14 14 0 0 1 14 14 v 44 a 14 14 0 0 1 -14 14 h -70 l -20 22 v -22 h -14 a 14 14 0 0 1 -14 -14 v -44 a 14 14 0 0 1 14 -14 z" stroke="#8b3a1a" stroke-width="3"/>
  <path d="M 140 118 l -6 30 M 158 118 l -6 30 M 130 128 h 30 M 128 138 h 30" stroke="#8b3a1a" stroke-width="2.5"/>

  <!-- speech bubble 2 (verdigris) with sentiment lines -->
  <path d="M 214 150 h 78 a 14 14 0 0 1 14 14 v 40 a 14 14 0 0 1 -14 14 h -52 v 20 l -18 -20 h -8 a 14 14 0 0 1 -14 -14 v -40 a 14 14 0 0 1 14 -14 z" stroke="#3a5a4e" stroke-width="3"/>
  <path d="M 232 174 h 52 M 232 188 h 40" stroke="#3a5a4e" stroke-width="2.5" opacity="0.75"/>
  <path d="M 236 200 l 6 6 l 12 -12" stroke="#3a5a4e" stroke-width="2.5"/>

  <!-- sentiment / emotion distribution bars -->
  <path d="M 96 320 H 316" stroke="#1a1612" stroke-width="2.5"/>
  <rect x="120" y="286" width="24" height="34" stroke="#3a5a4e" stroke-width="3"/>
  <rect x="160" y="262" width="24" height="58" stroke="#8b3a1a" stroke-width="3"/>
  <rect x="200" y="300" width="24" height="20" stroke="#a8742a" stroke-width="3"/>
  <rect x="240" y="276" width="24" height="44" stroke="#1a1612" stroke-width="3"/>
  <circle cx="132" cy="272" r="4" fill="#3a5a4e" stroke="none"/>
  <circle cx="172" cy="248" r="4" fill="#8b3a1a" stroke="none"/>
  <circle cx="252" cy="262" r="4" fill="#a8742a" stroke="none"/>
</svg>
