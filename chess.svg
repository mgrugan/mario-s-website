<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- AI Chess — a board, a knight's L-move, and a minimax decision branch -->
  <!-- construction guide -->
  <circle cx="200" cy="215" r="145" stroke="#3a5a4e" stroke-width="1" opacity="0.2"/>

  <!-- minimax decision branch (AI evaluating moves) -->
  <line x1="200" y1="70" x2="150" y2="112" stroke="#3a5a4e" stroke-width="2" opacity="0.7"/>
  <line x1="200" y1="70" x2="250" y2="112" stroke="#3a5a4e" stroke-width="2" opacity="0.7"/>
  <line x1="150" y1="112" x2="128" y2="150" stroke="#3a5a4e" stroke-width="2" opacity="0.55"/>
  <line x1="150" y1="112" x2="172" y2="150" stroke="#3a5a4e" stroke-width="2" opacity="0.55"/>
  <circle cx="200" cy="70" r="8" fill="#a8742a" stroke="none"/>
  <circle cx="150" cy="112" r="6" stroke="#1a1612" stroke-width="2.5"/>
  <circle cx="250" cy="112" r="6" stroke="#1a1612" stroke-width="2.5"/>
  <circle cx="128" cy="150" r="5" fill="#3a5a4e" stroke="none"/>
  <circle cx="172" cy="150" r="5" fill="#3a5a4e" stroke="none"/>

  <!-- 4x4 board -->
  <rect x="120" y="180" width="160" height="160" stroke="#1a1612" stroke-width="3"/>
  <g fill="#8b3a1a" opacity="0.16" stroke="none">
    <rect x="120" y="180" width="40" height="40"/>
    <rect x="200" y="180" width="40" height="40"/>
    <rect x="160" y="220" width="40" height="40"/>
    <rect x="240" y="220" width="40" height="40"/>
    <rect x="120" y="260" width="40" height="40"/>
    <rect x="200" y="260" width="40" height="40"/>
    <rect x="160" y="300" width="40" height="40"/>
    <rect x="240" y="300" width="40" height="40"/>
  </g>
  <path d="M 160 180 V 340 M 200 180 V 340 M 240 180 V 340 M 120 220 H 280 M 120 260 H 280 M 120 300 H 280" stroke="#1a1612" stroke-width="1" opacity="0.4"/>

  <!-- knight's L-move: two up, one across -->
  <path d="M 140 320 V 240 H 220" stroke="#8b3a1a" stroke-width="3.5" stroke-dasharray="2 8"/>
  <path d="M 220 240 l -10 -6 M 220 240 l -10 6" stroke="#8b3a1a" stroke-width="3.5"/>
  <circle cx="140" cy="320" r="7" fill="#a8742a" stroke="none"/>
  <circle cx="220" cy="240" r="6" fill="none" stroke="#8b3a1a" stroke-width="3"/>
</svg>
