<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Social media agency — network of accounts and an organic growth curve -->
  <!-- construction guides -->
  <circle cx="200" cy="200" r="150" stroke="#3a5a4e" stroke-width="1" opacity="0.2"/>
  <line x1="40" y1="300" x2="360" y2="300" stroke="#8b3a1a" stroke-width="1" opacity="0.18"/>
  <line x1="70" y1="70" x2="70" y2="320" stroke="#8b3a1a" stroke-width="1" opacity="0.18"/>

  <!-- network edges -->
  <line x1="130" y1="120" x2="200" y2="90" stroke="#3a5a4e" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="90" x2="285" y2="130" stroke="#3a5a4e" stroke-width="2" opacity="0.6"/>
  <line x1="130" y1="120" x2="120" y2="200" stroke="#3a5a4e" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="90" x2="230" y2="185" stroke="#3a5a4e" stroke-width="2" opacity="0.5"/>
  <line x1="285" y1="130" x2="300" y2="205" stroke="#3a5a4e" stroke-width="2" opacity="0.5"/>

  <!-- hub node (flagship account) -->
  <circle cx="200" cy="90" r="26" stroke="#8b3a1a" stroke-width="4"/>
  <circle cx="200" cy="90" r="7" fill="#a8742a" stroke="none"/>
  <!-- satellite accounts -->
  <circle cx="130" cy="120" r="15" stroke="#1a1612" stroke-width="3"/>
  <circle cx="285" cy="130" r="15" stroke="#1a1612" stroke-width="3"/>
  <circle cx="120" cy="200" r="11" stroke="#3a5a4e" stroke-width="3"/>
  <circle cx="230" cy="185" r="11" stroke="#3a5a4e" stroke-width="3"/>
  <circle cx="300" cy="205" r="11" stroke="#3a5a4e" stroke-width="3"/>

  <!-- organic growth curve -->
  <path d="M 70 300 C 130 296 170 280 210 250 S 300 175 330 130" stroke="#8b3a1a" stroke-width="4"/>
  <path d="M 330 130 l -18 2 M 330 130 l -2 18" stroke="#8b3a1a" stroke-width="4"/>
  <!-- growth data points -->
  <circle cx="70" cy="300" r="5" fill="#1a1612" stroke="none"/>
  <circle cx="210" cy="250" r="5" fill="#a8742a" stroke="none"/>
  <circle cx="330" cy="130" r="6" fill="#8b3a1a" stroke="none"/>
</svg>
