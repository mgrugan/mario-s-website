<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Signal — SEO & GEO audit gauge, concentric signal rings and readout nodes -->
  <!-- construction rings -->
  <circle cx="200" cy="210" r="150" stroke="#3a5a4e" stroke-width="1" opacity="0.25"/>
  <circle cx="200" cy="210" r="110" stroke="#3a5a4e" stroke-width="1" opacity="0.3"/>
  <line x1="30" y1="210" x2="370" y2="210" stroke="#8b3a1a" stroke-width="1" opacity="0.2"/>
  <line x1="200" y1="40" x2="200" y2="380" stroke="#8b3a1a" stroke-width="1" opacity="0.2"/>

  <!-- gauge arc (background) -->
  <path d="M 90 250 A 120 120 0 1 1 310 250" stroke="#c9bd9e" stroke-width="10"/>
  <!-- gauge arc (score fill ~ two-thirds) -->
  <path d="M 90 250 A 120 120 0 0 1 275 88" stroke="#8b3a1a" stroke-width="10"/>
  <!-- needle -->
  <line x1="200" y1="210" x2="150" y2="130" stroke="#1a1612" stroke-width="4"/>
  <circle cx="200" cy="210" r="9" fill="#a8742a" stroke="none"/>

  <!-- signal / bar readout -->
  <rect x="150" y="286" width="14" height="40" stroke="#3a5a4e" stroke-width="3"/>
  <rect x="175" y="270" width="14" height="56" stroke="#8b3a1a" stroke-width="3"/>
  <rect x="200" y="252" width="14" height="74" stroke="#a8742a" stroke-width="3"/>
  <rect x="225" y="278" width="14" height="48" stroke="#1a1612" stroke-width="3"/>

  <!-- orbiting data nodes -->
  <circle cx="90" cy="250" r="6" fill="#8b3a1a" stroke="none"/>
  <circle cx="310" cy="250" r="6" fill="#3a5a4e" stroke="none"/>
  <circle cx="275" cy="88" r="6" fill="#a8742a" stroke="none"/>
  <circle cx="200" cy="60" r="5" fill="#1a1612" stroke="none"/>
</svg>
