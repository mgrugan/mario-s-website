<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- AI Detector — an essay classified by a decision tree into human vs AI writing -->
  <!-- construction guide -->
  <circle cx="200" cy="210" r="150" stroke="#3a5a4e" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="210" r="108" stroke="#3a5a4e" stroke-width="1" opacity="0.28"/>

  <!-- essay / document (input text) -->
  <rect x="158" y="46" width="84" height="62" rx="6" stroke="#1a1612" stroke-width="3"/>
  <line x1="172" y1="66" x2="228" y2="66" stroke="#8b3a1a" stroke-width="3"/>
  <line x1="172" y1="78" x2="228" y2="78" stroke="#c9bd9e" stroke-width="3"/>
  <line x1="172" y1="90" x2="210" y2="90" stroke="#c9bd9e" stroke-width="3"/>

  <!-- feed into the classifier -->
  <line x1="200" y1="108" x2="200" y2="134" stroke="#8b3a1a" stroke-width="3"/>

  <!-- decision-tree branches -->
  <line x1="200" y1="146" x2="132" y2="214" stroke="#3a5a4e" stroke-width="2.5" opacity="0.7"/>
  <line x1="200" y1="146" x2="268" y2="214" stroke="#3a5a4e" stroke-width="2.5" opacity="0.7"/>
  <line x1="132" y1="222" x2="96" y2="298" stroke="#3a5a4e" stroke-width="2.5" opacity="0.55"/>
  <line x1="132" y1="222" x2="168" y2="298" stroke="#3a5a4e" stroke-width="2.5" opacity="0.55"/>
  <line x1="268" y1="222" x2="232" y2="298" stroke="#3a5a4e" stroke-width="2.5" opacity="0.55"/>
  <line x1="268" y1="222" x2="304" y2="298" stroke="#3a5a4e" stroke-width="2.5" opacity="0.55"/>

  <!-- root decision node -->
  <circle cx="200" cy="140" r="10" fill="#a8742a" stroke="none"/>

  <!-- inner decision nodes -->
  <circle cx="132" cy="216" r="7" stroke="#1a1612" stroke-width="2.5"/>
  <circle cx="268" cy="216" r="7" stroke="#1a1612" stroke-width="2.5"/>

  <!-- leaf: HUMAN (verdigris ring + check) -->
  <circle cx="96" cy="308" r="16" stroke="#3a5a4e" stroke-width="3"/>
  <path d="M 88 308 l 6 6 l 10 -13" stroke="#3a5a4e" stroke-width="3"/>

  <!-- neutral leaves -->
  <circle cx="168" cy="308" r="6" fill="#c9bd9e" stroke="none"/>
  <circle cx="232" cy="308" r="6" fill="#c9bd9e" stroke="none"/>

  <!-- leaf: AI (oxblood ring + machine hash) -->
  <circle cx="304" cy="308" r="16" stroke="#8b3a1a" stroke-width="3"/>
  <line x1="298" y1="303" x2="310" y2="303" stroke="#8b3a1a" stroke-width="2.5"/>
  <line x1="298" y1="309" x2="310" y2="309" stroke="#8b3a1a" stroke-width="2.5"/>
  <line x1="298" y1="315" x2="310" y2="315" stroke="#8b3a1a" stroke-width="2.5"/>
</svg>
