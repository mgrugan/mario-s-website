<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Map of God — a 3D atlas of real stars: a cosmic web, the Sun, and a planetary system -->
  <!-- construction guide -->
  <circle cx="200" cy="205" r="152" stroke="#3a5a4e" stroke-width="1" opacity="0.2"/>

  <!-- cosmic web: filaments woven between stars -->
  <path d="M 72 128 L 132 196 L 96 286 L 206 300 L 300 262 L 344 196 M 132 196 L 214 156 L 300 262 M 214 156 L 200 205 L 206 300"
        stroke="#3a5a4e" stroke-width="1.5" opacity="0.32"/>

  <!-- star-field nodes (varied real-star colours & brightness) -->
  <circle cx="72" cy="128" r="4" fill="#3a5a4e" stroke="none"/>
  <circle cx="132" cy="196" r="3" fill="#1a1612" stroke="none"/>
  <circle cx="96" cy="286" r="4.5" fill="#a8742a" stroke="none"/>
  <circle cx="206" cy="300" r="3.5" fill="#3a5a4e" stroke="none"/>
  <circle cx="344" cy="196" r="3" fill="#1a1612" stroke="none"/>
  <circle cx="214" cy="156" r="3" fill="#8b3a1a" stroke="none"/>
  <circle cx="300" cy="262" r="4" fill="#8b3a1a" stroke="none"/>

  <!-- the Sun at the origin (golden glow) -->
  <circle cx="200" cy="205" r="15" stroke="#a8742a" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="205" r="6" fill="#a8742a" stroke="none"/>

  <!-- a featured system: a star with real planets on clean orbital rings -->
  <circle cx="300" cy="118" r="46" stroke="#c9bd9e" stroke-width="1.5"/>
  <circle cx="300" cy="118" r="28" stroke="#c9bd9e" stroke-width="1.5"/>
  <circle cx="300" cy="118" r="7" fill="#8b3a1a" stroke="none"/>
  <circle cx="338" cy="92" r="4" fill="#3a5a4e" stroke="none"/>
  <circle cx="276" cy="132" r="3.5" fill="#a8742a" stroke="none"/>

  <!-- hover targeting reticle locking onto a star -->
  <circle cx="150" cy="96" r="4.5" fill="#8b3a1a" stroke="none"/>
  <circle cx="150" cy="96" r="15" stroke="#8b3a1a" stroke-width="1.5" opacity="0.55"/>
  <path d="M 150 76 v 7 M 150 109 v 7 M 130 96 h 7 M 163 96 h 7" stroke="#8b3a1a" stroke-width="1.5" opacity="0.55"/>
</svg>
